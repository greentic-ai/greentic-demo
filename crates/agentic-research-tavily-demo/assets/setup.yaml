title: Agentic Research (Tavily) — LLM
description: LLM provider settings for the research agent flow. The Tavily web-search key is configured by the bundled agent pack.
questions:
  - name: provider
    kind: string
    required: false
    title: LLM provider
    help: Provider style for the OpenAI-compatible API used by the research agent's reasoning loop.
    default: deepseek
    placeholder: deepseek
  - name: model
    kind: string
    required: false
    title: LLM model
    help: Model name for the configured OpenAI-compatible API.
    default: deepseek-chat
    placeholder: deepseek-chat
  - name: api_key_secret
    secret_key: api_key_secret
    kind: string
    required: false
    secret: true
    title: LLM API key
    help: API key for the OpenAI-compatible LLM used by the research agent. Passed through as a secret reference and never written in plaintext.
    placeholder: sk-...
